services:
  nginx:
    image: nginx:1.27-alpine
    container_name: devsecops-nginx
    ports:
      - "9090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice-shop
    networks:
      - public-net
      - internal-net
    restart: unless-stopped

  juice-shop:
    build:
      context: ./juice-shop
      dockerfile: Dockerfile
    image: devsecops-project/juice-shop:local
    container_name: devsecops-juice-shop
    expose:
      - "3000"
    networks:
      - internal-net
    restart: unless-stopped

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge